<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TIOS">
  <!-- Regular pentagon radar (point up), matching product icon -->
  <defs>
    <path
      id="grid"
      fill="none"
      stroke="#3b82f6"
      stroke-width="1.1"
      stroke-linejoin="round"
      d="M16 3.2 L28.2 12.1 L23.5 26.8 L8.5 26.8 L3.8 12.1 Z"
    />
  </defs>

  <!-- Outer + mid grid rings -->
  <use href="#grid" />
  <path
    fill="none"
    stroke="#60a5fa"
    stroke-width="0.9"
    stroke-linejoin="round"
    opacity="0.9"
    d="M16 8.8 L23.3 14.2 L20.5 23 L11.5 23 L8.7 14.2 Z"
  />

  <!-- Axes to vertices -->
  <g stroke="#3b82f6" stroke-width="0.85" stroke-linecap="round" opacity="0.85">
    <line x1="16" y1="16" x2="16" y2="3.2" />
    <line x1="16" y1="16" x2="28.2" y2="12.1" />
    <line x1="16" y1="16" x2="23.5" y2="26.8" />
    <line x1="16" y1="16" x2="8.5" y2="26.8" />
    <line x1="16" y1="16" x2="3.8" y2="12.1" />
  </g>

  <!-- Data polygon (stylized profile fill) -->
  <path
    fill="#93c5fd"
    fill-opacity="0.55"
    stroke="#2563eb"
    stroke-width="1"
    stroke-linejoin="round"
    d="M16 7.4 L24.6 14.8 L20.2 22.6 L11.2 21.4 L9.2 13.6 Z"
  />

  <!-- Center accent -->
  <circle cx="16" cy="16" r="2.2" fill="#eab308" />
</svg>
