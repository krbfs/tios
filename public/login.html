<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon-120.png" type="image/png" sizes="120x120" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="ga-measurement-id" content="G-TYYGE7DS6E" />
    <title>Войти | TIOS</title>
    <meta name="description" content="Вход в профиль TIOS для сохранения результатов теста ТИОС." />
    <link rel="canonical" href="https://tios-test.com/login" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="TIOS" />
    <meta property="og:title" content="Войти | TIOS" />
    <meta property="og:description" content="Вход в профиль TIOS для сохранения результатов теста ТИОС." />
    <meta property="og:url" content="https://tios-test.com/login" />
    <meta property="og:image" content="https://tios-test.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TIOS — тест ТИОС, управленческий психотип за 10 минут" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Войти | TIOS" />
    <meta name="twitter:description" content="Вход в профиль TIOS для сохранения результатов теста ТИОС." />
    <meta name="twitter:image" content="https://tios-test.com/og.png" />
    <link rel="stylesheet" href="/css/test.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <main class="container" style="max-width: 420px; padding-top: 48px">
      <div class="card">
        <h1>Войти</h1>
        <p class="muted">
          Вход <strong>не обязателен</strong>. Без входа результат зашивается в ссылку —
          скопируйте ее на странице результата. С входом те же ссылки еще сохраняются
          в <a href="/cabinet.html">личном кабинете</a>.
        </p>
        <form id="login-form" class="admin-toolbar">
          <label class="admin-field">
            Email
            <input id="email" type="email" required autocomplete="username" />
          </label>
          <label class="admin-field">
            Пароль
            <input id="password" type="password" required autocomplete="current-password" />
          </label>
          <button
            id="auth-submit-btn"
            class="btn btn-primary"
            type="submit"
            data-ga-event="cta_login_submit"
          >Войти</button>
          <p id="error" class="error" hidden></p>
        </form>
        <p class="muted" style="margin-top: 16px">
          Нет аккаунта?
          <a href="#" id="register-link">Зарегистрироваться</a>
        </p>
        <div class="actions login-alt-actions">
          <a
            class="btn btn-outline"
            href="/test/start.html"
            data-ga-event="cta_login_start_anonymous"
          >Пройти тест</a>
          <a class="btn btn-outline" href="/" data-ga-event="cta_login_home">На главную</a>
        </div>
      </div>
    </main>

    <script type="module">
      import { initSiteAnalytics } from "/js/analytics.js";
      import {
        loginUser,
        registerUser,
        validateUserSession,
      } from "/js/user-auth.js";

      initSiteAnalytics();

      const params = new URLSearchParams(window.location.search);
      const next = params.get("next") || "/cabinet.html";

      validateUserSession().then((isAuthenticated) => {
        if (isAuthenticated) {
          window.location.replace(next);
        }
      });

      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("error");
      const submitBtn = document.getElementById("auth-submit-btn");
      let registerMode = false;

      function updateAuthModeUi() {
        submitBtn.textContent = registerMode ? "Зарегистрироваться" : "Войти";
        submitBtn.dataset.gaEvent = registerMode
          ? "cta_register_submit"
          : "cta_login_submit";
        document.getElementById("register-link").textContent = registerMode
          ? "Уже есть аккаунт? Войти"
          : "Зарегистрироваться";
      }

      document.getElementById("register-link").addEventListener("click", (event) => {
        event.preventDefault();
        registerMode = !registerMode;
        updateAuthModeUi();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        submitBtn.disabled = true;

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          if (registerMode) {
            await registerUser(email, password);
          } else {
            await loginUser(email, password);
          }
          window.location.replace(next);
        } catch (error) {
          errorEl.textContent =
            error instanceof Error ? error.message : "Не удалось выполнить вход";
          errorEl.hidden = false;
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
