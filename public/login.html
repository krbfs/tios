<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="ga-measurement-id" content="G-G5TG1F8M5N" />
    <title>Войти — Teamconstructor</title>
    <link rel="stylesheet" href="/css/test.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <main class="container" style="max-width: 420px; padding-top: 48px">
      <div class="card">
        <h1>Войти</h1>
        <p class="muted">
          Вход <strong>не обязателен</strong>. Без входа результат зашивается в ссылку —
          скопируйте ее на странице результата. С входом те же ссылки еще сохраняются
          в <a href="/cabinet.html">личном кабинете</a>.
        </p>
        <form id="login-form" class="admin-toolbar">
          <label class="admin-field">
            Email
            <input id="email" type="email" required autocomplete="username" />
          </label>
          <label class="admin-field">
            Пароль
            <input id="password" type="password" required autocomplete="current-password" />
          </label>
          <button
            id="auth-submit-btn"
            class="btn btn-primary"
            type="submit"
            data-ga-event="cta_login_submit"
          >Войти</button>
          <p id="error" class="error" hidden></p>
        </form>
        <p class="muted" style="margin-top: 16px">
          Нет аккаунта?
          <a href="#" id="register-link">Зарегистрироваться</a>
        </p>
        <p class="muted">
          <a href="/test/start.html" data-ga-event="cta_login_start_anonymous">Пройти тест без входа</a> ·
          <a href="/" data-ga-event="cta_login_home">На главную</a>
        </p>
      </div>
    </main>

    <script type="module">
      import { initSiteAnalytics } from "/js/analytics.js";
      import { getAccessToken, loginUser, registerUser } from "/js/user-auth.js";

      initSiteAnalytics();

      const params = new URLSearchParams(window.location.search);
      const next = params.get("next") || "/cabinet.html";

      if (getAccessToken()) {
        window.location.replace(next);
      }

      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("error");
      const submitBtn = document.getElementById("auth-submit-btn");
      let registerMode = false;

      function updateAuthModeUi() {
        submitBtn.textContent = registerMode ? "Зарегистрироваться" : "Войти";
        submitBtn.dataset.gaEvent = registerMode
          ? "cta_register_submit"
          : "cta_login_submit";
        document.getElementById("register-link").textContent = registerMode
          ? "Уже есть аккаунт? Войти"
          : "Зарегистрироваться";
      }

      document.getElementById("register-link").addEventListener("click", (event) => {
        event.preventDefault();
        registerMode = !registerMode;
        updateAuthModeUi();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.hidden = true;

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          if (registerMode) {
            await registerUser(email, password);
          } else {
            await loginUser(email, password);
          }
          window.location.replace(next);
        } catch (error) {
          errorEl.textContent = error.message;
          errorEl.hidden = false;
        }
      });
    </script>
  </body>
</html>
